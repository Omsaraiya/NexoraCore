<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoraCore | Task Manager</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">
                <h2>NexoraCore</h2>
            </div>
            <nav id="dynamic-sidebar" class="side-nav"></nav>
            <div class="logout-section">
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
    <h2 class="topbar-brand">Command Center</h2>
    <div class="topbar-tools">
        <input id="global-search" name="global-search" class="topbar-search" type="search" placeholder="Search ERP records...">
        <select id="plant-switcher" name="plant-switcher" class="plant-switcher">
            <option>Unit I</option><option>Unit II</option><option>Unit III</option>
        </select>
        <span class="fy-chip">FY 2026-27</span>
        <div class="profile-chip user-info">Welcome, Rahul Sharma</div>
    </div>
</header>

            <main class="content-area">
                <section class="page-header">
                    <div class="page-header-copy">
                        <div class="breadcrumb">OVERVIEW / TASK MANAGER</div>
                        <h1>Assign & Manage Tasks</h1>
                    </div>
                </section>
                <div class="panel-card p-20" style="margin-bottom: 25px;">
                    <h3 class="mt-0">Create Workflow Event</h3>
                    <form id="taskForm">
                        <div class="grid-3-col" style="margin-bottom: 0;">
                            <div class="input-group">
                                <label>Assign To (Employee)</label>
                                <select id="empName" required>
                                    <option value="">Loading employees...</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Task Description</label>
                                <input type="text" id="taskDesc" required placeholder="Describe the workflow...">
                            </div>
                            <div class="input-group">
                                <label>Due Date</label>
                                <input type="date" id="dueDate" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" id="submitTaskBtn" style="margin-top: 10px;">Assign
                            Task</button>
                    </form>
                </div>

                <div class="panel-card">
                    <div class="panel-header" style="padding: 20px; border-bottom: 1px solid #e2e8f0;">
                        <h3 style="margin: 0; font-size: 16px;">Manage Existing Tasks</h3>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Employee</th>
                                    <th>Task</th>
                                    <th>Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="managementTableBody">
                                <tr>
                                    <td colspan="4" style="text-align:center;">Loading tasks...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/ui-handler.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', initSidebar);
    </script>
</body>

</html>
