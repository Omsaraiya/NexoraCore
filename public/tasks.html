<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoraCore | Task Manager</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="main-wrap">
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="topbar-title" style="margin:0;">Command Center</h1>
                </div>
            </header>
            <main class="content-area" style="padding: 24px;">
                <section class="page-header">
                    <div class="page-header-copy">
                        <div class="breadcrumb">OVERVIEW / TASK MANAGER</div>
                        <h1>Assign & Manage Tasks</h1>
                    </div>
                </section>
                <div class="module-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <div class="pill-tabs" style="display:flex; background:#f1f5f9; border-radius:20px; padding:4px;">
                        <button class="pill-btn active" style="border:none; padding:6px 16px; border-radius:16px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,0.05); font-weight:600;">All Tasks</button>
                        <button class="pill-btn" style="border:none; background:transparent; padding:6px 16px; color:#64748b;">Pending</button>
                        <button class="pill-btn" style="border:none; background:transparent; padding:6px 16px; color:#64748b;">Completed</button>
                    </div>
                    <button id="btn-new-task" class="btn btn-primary" style="width:fit-content; white-space:nowrap;">+ Assign Task</button>
                </div>

                <div class="panel-card">
                    <div class="panel-header" style="padding: 20px; border-bottom: 1px solid #e2e8f0;">
                        <h3 style="margin: 0; font-size: 16px;">Manage Existing Tasks</h3>
                    </div>
                    <div class="table-container" style="width: 100%;">
                        <table class="data-table" style="width: 100%; min-width: 100%;">
                            <thead>
                                <tr>
                                    <th>Employee</th>
                                    <th>Task</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="managementTableBody">
                                <tr>
                                    <td colspan="5" style="text-align:center;">Loading tasks...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="modal-add-task" class="glass-modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.4); z-index:1000; align-items:center; justify-content:center;">
        <div class="smart-modal" style="background:#fff; border-radius:16px; padding:24px; max-width:600px; width:100%; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);">
            <div id="addTaskModal" class="modal-overlay" style="position: static; inset: auto; background: transparent; display:block;">
                <div class="modal-content" style="box-shadow:none; border:none; background:transparent; max-width:none; padding:0;">
                    <h3 class="mt-0">Create Workflow Event</h3>
                    <form id="taskForm">
                        <div class="grid-3-col" style="margin-bottom: 0;">
                            <div class="input-group">
                                <label>Assign To (Employee)</label>
                                <select id="empName" required>
                                    <option value="">Loading employees...</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Task Description</label>
                                <input type="text" id="taskDesc" required placeholder="Describe the workflow...">
                            </div>
                            <div class="input-group">
                                <label>Due Date</label>
                                <input type="date" id="dueDate" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" id="submitTaskBtn" style="margin-top: 10px;">Assign Task</button>
                    </form>
                </div>
            </div>
            <button type="button" id="close-add-task" class="btn" style="margin-top:15px; width:100%;">Cancel</button>
        </div>
    </div>

    <div id="modal-task-detail" class="glass-modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.4); z-index:1000; align-items:center; justify-content:center;">
        <div class="smart-modal" style="background:#fff; border-radius:16px; padding:24px; max-width:600px; width:100%;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <div>
                    <h3 id="detail-task-desc" style="margin:0; font-size:1.1rem; color:#0f172a;">Task Description</h3>
                    <div style="font-size:0.85rem; color:#94a3b8; margin-top:4px;">Workflow Event</div>
                </div>
                <button id="close-task-detail" style="border:none; background:none; font-size:1.2rem; cursor:pointer; color:#94a3b8;">×</button>
            </div>
            <div class="detail-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
                <div class="detail-box"><span class="detail-label">Assignee</span><span id="detail-box-assignee" class="detail-value">-</span></div>
                <div class="detail-box"><span class="detail-label">Assigned Date</span><span id="detail-box-tdate" class="detail-value">-</span></div>
                <div class="detail-box"><span class="detail-label">Current Status</span><span id="detail-box-tstatus" class="detail-value">-</span></div>
                <div class="detail-box"><span class="detail-label">Priority Level</span><span class="detail-value" style="color:#ef4444; font-weight:600;">High</span></div>
            </div>
            <label style="font-size:0.75rem; color:#64748b; margin-bottom:10px; display:block; font-weight:700; text-transform:uppercase;">Actions Taken</label>
            <div id="detail-box-taction" style="padding:12px; background:#f8fafc; border-radius:8px; border:1px solid #e2e8f0; font-size:0.9rem; color:#475569;">-</div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui-handler.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', initSidebar);
    </script>
</body>

</html>
