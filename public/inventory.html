<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoraCore | Inventory Manager</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">
                <h2>NexoraCore</h2>
            </div>
            <nav id="dynamic-sidebar" class="side-nav"></nav>
            <div class="logout-section">
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <h2>Command Center</h2>
                <div class="topbar-tools">
                    <input id="global-search" name="global-search" class="topbar-search" type="search" placeholder="Search ERP records..." aria-label="Global search">
                    <select id="plant-switcher" name="plant-switcher" class="plant-switcher" aria-label="Plant switcher">
                        <option>Unit I</option>
                        <option>Unit III</option>
                        <option>Unit III</option>
                    </select>
                    <span class="fy-chip">FY 2026-27</span>
                    <div class="profile-chip user-info">Pradeep Kumar - Plant Manager</div>
                </div>
            </header>

            <main class="content-area">
                <div class="panel-card">
                    <div class="panel-header"
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0; padding: 20px; border-bottom: 1px solid #e2e8f0;">
                        <div>
                            <h3 style="margin: 0; color: #0f172a; font-size: 18px;">Live Stock Ledger</h3>
                            <p style="margin: 4px 0 0 0; font-size: 13px; color: #64748b;">Real-time tracking of raw
                                materials and finished goods.</p>
                        </div>
                        <div>
                            <button onclick="exportTableToCSV('inventory_ledger.csv')" class="btn-secondary"
                                style="margin-right: 10px; width: auto; padding: 8px 16px; font-size: 13px;">📥 Export
                                CSV</button>
                            <button id="openInventoryModal" class="btn-primary" style="padding: 8px 16px; font-size: 13px; width: auto;">+ Add
                                New Item</button>
                        </div>
                    </div>

                    <div class="erp-scroll">
                        <table class="data-table erp-table" style="width: 100%; text-align: left; border-collapse: collapse;">
                        <thead>
                            <tr
                                style="border-bottom: 2px solid #e2e8f0; color: #64748b; font-size: 12px; text-transform: uppercase;">
                                <th class="label-caps" style="padding: 12px 8px;">Item ID</th>
                                <th class="label-caps" style="padding: 12px 8px;">Item Name</th>
                                <th class="label-caps" style="padding: 12px 8px;">Category</th>
                                <th class="label-caps num" style="padding: 12px 8px;">Current Stock</th>
                                <th class="label-caps" style="padding: 12px 8px;">Status</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <tr>
                                <td colspan="5" style="text-align:center; padding: 20px; color: #64748b;">Syncing
                                    warehouse data...</td>
                            </tr>
                        </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="addInventoryModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="inventoryModalTitle">
        <div class="modal-content">
            <button id="closeInventoryModal" class="modal-close" type="button" aria-label="Close">&times;</button>
            <h3 id="inventoryModalTitle">Add Inventory Item</h3>
            <p class="text-muted">Register a raw material in the warehouse ledger.</p>
            <form id="inventoryForm">
                <div class="input-group">
                    <label for="inventoryItemName">Item name</label>
                    <input id="inventoryItemName" required maxlength="100">
                </div>
                <div class="input-group">
                    <label for="inventoryCategory">Category</label>
                    <input id="inventoryCategory" value="Raw Material" required maxlength="60">
                </div>
                <div class="grid-2-col compact-grid">
                    <div class="input-group">
                        <label for="inventoryStock">Current stock</label>
                        <input id="inventoryStock" type="number" min="0" step="1" required>
                    </div>
                    <div class="input-group">
                        <label for="inventoryReorderLevel">Reorder level</label>
                        <input id="inventoryReorderLevel" type="number" min="0" step="1" value="50" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Add Item</button>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', initSidebar);
    </script>
    <script src="js/ui-handler.js"></script>
</body>

</html>
