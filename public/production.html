<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoraCore | Production Logs</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">
                <h2>NexoraCore</h2>
            </div>
            <nav id="dynamic-sidebar" class="side-nav"></nav>
            <div class="logout-section">
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <h2>Command Center</h2>
                <div class="topbar-tools">
                    <input id="global-search" name="global-search" class="topbar-search" type="search" placeholder="Search ERP records..." aria-label="Global search">
                    <select id="plant-switcher" name="plant-switcher" class="plant-switcher" aria-label="Plant switcher">
                        <option>Unit I</option>
                        <option>Unit II</option>
                        <option>Unit III</option>
                    </select>
                    <span class="fy-chip">FY 2026-27</span>
                    <div class="profile-chip user-info">Pradeep Kumar - Plant Manager</div>
                </div>
            </header>

            <main class="content-area">
                <section class="page-header">
                    <div class="page-header-copy">
                        <div class="breadcrumb">PRODUCTION & QUALITY / PRODUCTION LOGS</div>
                        <h1>Shop Floor MES</h1>
                    </div>
                </section>
                <div class="grid-2-col">
                    <div class="panel-card p-20">
                        <h3 class="mt-0">Shop Floor MES</h3>
                        <p class="text-muted">Log completed batches to update live inventory.</p>

                        <form id="productionForm">
                            <div class="grid-2-col" style="margin-bottom: 0;">
                                <div class="input-group">
                                    <label>Finished Product Name</label>
                                    <input type="text" id="prodItem" placeholder="e.g. Thermal Overload Protector"
                                        required>
                                </div>
                                <div class="input-group">
                                    <label>Quantity Produced</label>
                                    <input type="number" id="prodQty" min="1" required>
                                </div>
                            </div>

                            <hr style="border: none; border-top: 1px dashed #cbd5e1; margin: 15px 0;">

                            <div class="grid-2-col" style="margin-bottom: 0;">
                                <div class="input-group">
                                    <label>Raw Material Consumed</label>
                                    <input type="text" id="rmItem" placeholder="e.g. Silver Contacts" required>
                                </div>
                                <div class="input-group">
                                    <label>RM Quantity Used</label>
                                    <input type="number" id="rmQty" min="1" required>
                                </div>
                            </div>
                            <button type="submit" id="prodBtn" class="btn-primary" style="margin-top: 10px;">Log
                                Production Run</button>
                        </form>
                    </div>

                    <div class="panel-card p-20">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h3 class="mt-0" style="margin-bottom: 0;">Production Ledger</h3>
                            <button onclick="exportTableToCSV('production_ledger.csv')" class="btn-secondary"
                                style="width: auto; padding: 6px 12px; font-size: 11px;">📥 Export CSV</button>
                        </div>
                        <div class="erp-scroll">
                            <table class="data-table erp-table">
                                <thead>
                                    <tr>
                                        <th class="label-caps">PRD ID</th>
                                        <th class="label-caps">DATE</th>
                                        <th class="label-caps">PRODUCT</th>
                                        <th class="label-caps num">QTY</th>
                                        <th class="label-caps">STATUS</th>
                                    </tr>
                                </thead>
                                <tbody id="prodTableBody">
                                    <tr>
                                        <td colspan="5" class="text-center">Syncing shop floor data...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui-handler.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', initSidebar);
    </script>
</body>

</html>
