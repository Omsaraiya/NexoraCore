<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoraCore | Supply Chain</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">
                <h2>NexoraCore</h2>
            </div>
            <nav id="dynamic-sidebar" class="side-nav"></nav>
            <div class="logout-section">
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
    <h2 class="topbar-brand">Command Center</h2>
    <div class="topbar-tools">
        <input id="global-search" name="global-search" class="topbar-search" type="search" placeholder="Search ERP records...">
        <select id="plant-switcher" name="plant-switcher" class="plant-switcher">
            <option>Unit I</option><option>Unit II</option><option>Unit III</option>
        </select>
        <span class="fy-chip">FY 2026-27</span>
        <div class="profile-chip user-info">Welcome, Rahul Sharma</div>
    </div>
</header>

            <main class="content-area">
                <section class="page-header">
                    <div class="page-header-copy">
                        <div class="breadcrumb">SUPPLY & INVENTORY / SUPPLY CHAIN</div>
                        <h1>Supply Chain Manager</h1>
                    </div>
                </section>
                <div class="grid-2-col">
                    <div class="panel-card p-20">
                        <h3 class="mt-0">Log Supply Chain Event</h3>
                        <p class="text-muted">Record material purchases or client sales.</p>

                        <form id="supplyForm">
                            <div class="grid-2-col" style="margin-bottom: 0;">
                                <div class="input-group">
                                    <label for="supplyType">Pipeline Stage</label>
                                    <select id="supplyType" required>
                                        <option value="Purchase Order (Procure-to-Pay)">Purchase Order (Procure-to-Pay)
                                        </option>
                                        <option value="Sales Order (Order-to-Cash)">Sales Order (Order-to-Cash)</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label for="supplyPartner">Client / Supplier Name</label>
                                    <input type="text" id="supplyPartner" placeholder="e.g. Voltas, Havells..."
                                        required>
                                </div>
                            </div>

                            <div class="input-group">
                                <label for="supplyItem">Item / Material Name</label>
                                <input type="text" id="supplyItem" placeholder="e.g. Thermal Overload Protector"
                                    required>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                                <div class="input-group">
                                    <label for="supplyQty">Quantity</label>
                                    <input type="number" id="supplyQty" min="1" placeholder="e.g. 500" required>
                                </div>
                                <div class="input-group">
                                    <label for="supplyValue">Total Value (₹)</label>
                                    <input type="number" id="supplyValue" min="0" placeholder="e.g. 25000" required>
                                </div>
                                <div class="input-group">
                                    <label for="supplyStatus">Order Status</label>
                                    <select id="supplyStatus" required>
                                        <option value="Pending">Pending / Draft</option>
                                        <option value="Dispatched / Delivered">Dispatched / Delivered</option>
                                        <option value="Invoiced">Invoiced & Settled</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" id="supplyBtn" class="btn-primary">Process Order</button>
                        </form>
                    </div>

                    <div class="panel-card p-20">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h3 class="mt-0" style="margin-bottom: 0;">Supply Ledger</h3>
                            <button onclick="exportTableToCSV('supply_ledger.csv')" class="btn-secondary"
                                style="width: auto; padding: 6px 12px; font-size: 11px;">📥 Export CSV</button>
                        </div>
                        <div class="table-scroll-wrapper">
                            <table class="data-table erp-table">
                                <thead>
                                    <tr>
                                        <th class="label-caps">Doc ID</th>
                                        <th class="label-caps">Date</th>
                                        <th class="label-caps">Type</th>
                                        <th class="label-caps">Partner</th>
                                        <th class="label-caps">Item</th>
                                        <th class="label-caps num">Qty</th>
                                        <th class="label-caps num">Value (₹)</th>
                                        <th class="label-caps">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="supplyTableBody">
                                    <tr>
                                        <td colspan="8" class="text-center">Syncing ledger...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/ui-handler.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', initSidebar);
    </script>
</body>

</html>
