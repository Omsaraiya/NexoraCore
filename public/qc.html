<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoraCore | Quality Control</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">
                <h2>NexoraCore</h2>
            </div>
            <nav id="dynamic-sidebar" class="side-nav"></nav>
            <div class="logout-section">
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <h2>Command Center</h2>
                <div class="topbar-tools">
                    <input class="topbar-search" type="search" placeholder="Search ERP records..." aria-label="Global search">
                    <select class="plant-switcher" aria-label="Plant switcher">
                        <option>Unit I</option>
                        <option>Unit II</option>
                        <option>Unit III</option>
                    </select>
                    <span class="fy-chip">FY 2026-27</span>
                    <div class="profile-chip user-info">Pradeep Kumar - Plant Manager</div>
                </div>
            </header>
            <main class="content-area">
                <div class="panel-card p-20">
                    <h3 class="mt-0" style="margin-bottom: 5px;">Pending Incoming Quality Checks</h3>
                    <p class="text-muted" style="margin-bottom: 20px;">Procure-to-Pay raw materials awaiting dimensional
                        and tolerance verification.</p>

                    <div class="erp-scroll">
                        <table class="data-table erp-table">
                            <thead>
                                <tr>
                                    <th class="label-caps">PO REF</th>
                                    <th class="label-caps">DATE</th>
                                    <th class="label-caps">MATERIAL</th>
                                    <th class="label-caps num">QTY</th>
                                    <th class="label-caps">STATUS</th>
                                    <th class="label-caps">DISPOSITION</th>
                                </tr>
                            </thead>
                            <tbody id="qcTableBody">
                                <tr>
                                    <td colspan="6" class="text-center">Scanning supply ledger for pending
                                        inspections...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/ui-handler.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', initSidebar);
    </script>
</body>

</html>
