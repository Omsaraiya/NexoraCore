<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoraCore | Production Logs</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
</head>

<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">
                <h2>NexoraCore</h2>
            </div>
            <nav class="side-nav">
                <a href="dashboard.html">Overview</a>
                <a href="tasks.html">Task Manager</a>
                <a href="production.html" class="active">Production Logs</a>
            </nav>
            <div class="logout-section">
                <button id="logoutBtn" class="btn-secondary">Sign Out</button>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <h3 style="font-size: 18px; font-weight: 600;">Production & Audit Logs</h3>
                <div class="user-profile"><span id="userNameDisplay">Welcome, MD001</span></div>
            </header>

            <main class="content-area">
                <section class="panel-card" style="padding: 20px;">
                    <div class="panel-header" style="margin-bottom: 20px; border: none;">
                        <h4>Complete Master Ledger</h4>
                        <p style="font-size: 13px; color: var(--text-muted);">Read-only view of all database entries.
                        </p>
                    </div>

                    <div class="table-container" style="max-height: 600px;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Employee</th>
                                    <th>Task</th>
                                    <th>Status</th>
                                    <th>Due Date</th>
                                    <th>Completed At (Audit)</th>
                                </tr>
                            </thead>
                            <tbody id="productionTableBody">
                                <tr>
                                    <td colspan="5" style="text-align:center;">Fetching master logs...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui-handler.js"></script>
    <script>
        async function loadProductionLogs() {
            const tbody = document.getElementById('productionTableBody');
            const data = await fetchDashboardStats();

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No logs found.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach((row) => {
                const tr = document.createElement('tr');
                const auditTime = row[4] ? `<span style="color: #16a34a; font-size: 12px;">${row[4]}</span>` : '<span style="color: #94a3b8; font-size: 12px;">Pending</span>';

                tr.innerHTML = `
                    <td><strong>${row[0] || 'N/A'}</strong></td>
                    <td>${row[1] || 'N/A'}</td>
                    <td>${row[2] || 'N/A'}</td>
                    <td>${row[3] || 'N/A'}</td>
                    <td>${auditTime}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        loadProductionLogs();
    </script>
</body>

</html>
