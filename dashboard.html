<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoraCore | MD Dashboard</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
</head>

<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">
                <h2>NexoraCore</h2>
            </div>
            <nav class="side-nav">
                <a href="#" class="active">Overview</a>
                <a href="tasks.html">Task Manager</a>
                <a href="#">Production Logs</a>
            </nav>
            <div class="logout-section">
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </div>
        </aside>

        <div class="main-wrapper">

            <header class="topbar">
                <h3>Dashboard Overview</h3>
                <div class="user-profile">
                    <span id="userNameDisplay">Welcome, MD001</span>
                </div>
            </header>

            <main class="content-area">

                <!-- Analytics Cards -->
                <section class="stats-grid">
                    <div class="stat-card">
                        <p class="stat-title">Active Tasks</p>
                        <h3 class="stat-value" id="activeTasksCount">--</h3>
                    </div>
                    <div class="stat-card">
                        <p class="stat-title">Delayed Tasks (Alerts)</p>
                        <h3 class="stat-value danger-text" id="delayedTasksCount">--</h3>
                    </div>
                    <div class="stat-card">
                        <p class="stat-title">Production Pass</p>
                        <h3 class="stat-value success-text" id="passCount">--</h3>
                    </div>
                    <div class="stat-card">
                        <p class="stat-title">Production Fail</p>
                        <h3 class="stat-value danger-text" id="failCount">--</h3>
                    </div>
                </section>

                <section class="recent-activities">
                    <div class="card-header">
                        <h4>Recent Workflow Updates</h4>
                    </div>
                    <div class="card-body">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Employee</th>
                                    <th>Task</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="recentTasksTable">
                                <tr>
                                    <td colspan="4" style="text-align:center; padding:20px;">Fetching live data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui-handler.js"></script>
</body>

</html>
